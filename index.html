<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tonight's Deck</title>
<meta name="description" content="A short deck of bodyweight and dumbbell exercises for when you're too tapped out to leave the house.">
<meta name="theme-color" content="#14141F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tonight">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314141F'/%3E%3Crect x='9' y='7' width='14' height='18' rx='3' fill='none' stroke='%239B8CE8' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14141F;
    --slate:#22223A;
    --slate-2:#2C2C48;
    --chalk:#E6E9F2;
    --dim:#797C96;
    --lilac:#9B8CE8;
    --sage:#6FA98B;
    --line:rgba(230,233,242,.12);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--chalk);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  body::before{
    content:'';
    position:fixed; inset:0;
    background:radial-gradient(ellipse 90% 60% at 50% -10%, rgba(155,140,232,.16), transparent 70%);
    pointer-events:none;
  }

  .app{
    width:100%; max-width:460px;
    min-height:100dvh;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column;
    position:relative; z-index:1;
  }

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .wordmark{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800; font-size:15px; letter-spacing:-.02em;
  }
  .wordmark span{color:var(--lilac)}
  .week{display:flex;gap:5px;align-items:center}
  .day{
    width:9px;height:9px;border-radius:2px;
    background:rgba(230,233,242,.11);
    transition:background .3s ease;
  }
  .day.on{background:var(--sage)}
  .day.today{box-shadow:0 0 0 1.5px rgba(155,140,232,.55)}

  /* ---------- shared ---------- */
  .screen{flex:1;display:flex;flex-direction:column;animation:rise .45s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--dim);
  }

  h1{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800; letter-spacing:-.035em; line-height:.98;
    font-size:clamp(38px,12vw,50px);
  }

  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  button:focus-visible{outline:2px solid var(--lilac);outline-offset:3px;border-radius:6px}

  /* ---------- start screen ---------- */
  .lede{margin-top:16px;color:var(--dim);font-size:15px;line-height:1.5;max-width:30ch}
  .modes{margin-top:auto;padding-top:36px;display:flex;flex-direction:column;gap:10px}

  .mode{
    display:flex;align-items:baseline;gap:14px;
    width:100%; text-align:left;
    padding:18px 18px;
    background:var(--slate);
    border:1px solid var(--line);
    border-radius:14px;
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .mode:hover,.mode:focus-visible{background:var(--slate-2);border-color:rgba(155,140,232,.4);transform:translateY(-2px)}
  .mode:active{transform:translateY(0)}
  .mode-n{
    font-family:'JetBrains Mono',monospace;font-weight:700;
    font-size:19px;color:var(--lilac);min-width:26px;
  }
  .mode-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px;letter-spacing:-.02em}
  .mode-sub{display:block;margin-top:3px;color:var(--dim);font-size:12.5px;font-weight:400;letter-spacing:0}

  /* ---------- card ---------- */
  .progress{display:flex;gap:4px;margin:22px 0 16px}
  .pip{flex:1;height:3px;border-radius:2px;background:rgba(230,233,242,.13)}
  .pip.done{background:var(--sage)}
  .pip.now{background:var(--lilac)}

  .card-wrap{perspective:1400px;flex:1;min-height:330px;display:flex}
  .card{
    position:relative;width:100%;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.3,.8,.3,1);
    cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--slate);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px;
    display:flex;flex-direction:column;
  }
  .face.back{transform:rotateY(180deg);background:var(--slate-2)}

  .tag{
    font-family:'JetBrains Mono',monospace;font-size:10px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--lilac);
  }
  figure{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 0}
  svg.fig{width:100%;max-width:290px;height:auto;display:block}
  .fig .stroke{fill:none;stroke:var(--chalk);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;filter:url(#chalk)}
  .fig .prop{fill:none;stroke:var(--dim);stroke-width:3;stroke-linecap:round;filter:url(#chalk)}
  .fig .ground{stroke:var(--dim);stroke-width:2;stroke-linecap:round;opacity:.55}
  .fig text{fill:var(--lilac);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700}

  .ex-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:29px;letter-spacing:-.03em;line-height:1.02}
  .dose{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--dim);margin-top:7px}
  .flip-hint{margin-top:14px;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
  .flip-hint::before{content:'';width:14px;height:1px;background:var(--dim)}

  .cue{font-size:19px;line-height:1.45;margin-top:16px;letter-spacing:-.01em}
  .back-note{margin-top:auto;font-size:12.5px;color:var(--dim);line-height:1.5}

  .actions{display:flex;gap:10px;margin-top:16px}
  .btn{
    flex:1;padding:16px;border-radius:13px;
    font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.01em;
    border:1px solid var(--line);
    transition:transform .16s ease,background .16s ease,border-color .16s ease;
  }
  .btn:active{transform:scale(.975)}
  .btn.ghost{color:var(--dim);flex:0 0 34%}
  .btn.ghost:hover{color:var(--chalk);border-color:rgba(230,233,242,.3)}
  .btn.solid{background:var(--lilac);color:#161428;border-color:transparent}
  .btn.solid:hover{background:#ab9dee}

  /* ---------- done ---------- */
  .done-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
  .streak-num{
    font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
    font-size:clamp(70px,26vw,110px);line-height:.85;letter-spacing:-.05em;color:var(--sage);
  }
  .done-sub{color:var(--dim);font-size:15px;line-height:1.5;max-width:30ch}
  .done-actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}

  .reset{
    margin-top:14px;align-self:flex-start;
    font-size:11.5px;color:var(--dim);text-decoration:underline;text-underline-offset:3px;
  }
  .reset:hover{color:var(--chalk)}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
    .card.flipped{transform:none}
    .face.back{transform:none}
    .card.flipped .face.front{display:none}
    .card:not(.flipped) .face.back{display:none}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="chalk">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="app">
  <div class="top">
    <div class="wordmark">tonight<span>.</span></div>
    <div class="week" id="week" aria-label="Last seven days"></div>
  </div>
  <div id="root"></div>
</div>

<script>
/* ============ figures ============ */
const G = '<line class="ground" x1="12" y1="122" x2="208" y2="122"/>';
const F = {
  pushup:`<circle class="stroke" cx="52" cy="58" r="11"/><path class="stroke" d="M63,64 L122,76 L174,92"/><path class="stroke" d="M63,64 L58,119"/><path class="stroke" d="M174,92 L183,119"/>${G}`,
  incline:`<rect class="prop" x="14" y="66" width="52" height="54" rx="4"/><circle class="stroke" cx="80" cy="56" r="11"/><path class="stroke" d="M91,63 L134,86 L180,110"/><path class="stroke" d="M91,63 L62,69"/><path class="stroke" d="M180,110 L188,120"/>${G}`,
  decline:`<rect class="prop" x="168" y="72" width="44" height="48" rx="4"/><circle class="stroke" cx="42" cy="76" r="11"/><path class="stroke" d="M53,80 L112,72 L166,63"/><path class="stroke" d="M53,80 L48,119"/><path class="stroke" d="M166,63 L174,72"/>${G}`,
  tempo:`<circle class="stroke" cx="52" cy="58" r="11"/><path class="stroke" d="M63,64 L122,76 L174,92"/><path class="stroke" d="M63,64 L58,119"/><path class="stroke" d="M174,92 L183,119"/><path class="prop" d="M108,28 L108,52 M102,45 L108,53 L114,45" stroke="#9B8CE8"/><text x="118" y="44">3s</text>${G}`,
  archer:`<circle class="stroke" cx="70" cy="56" r="11"/><path class="stroke" d="M81,62 L134,74 L182,90"/><path class="stroke" d="M81,62 L78,119"/><path class="stroke" d="M81,62 L26,113"/><path class="stroke" d="M182,90 L190,119"/>${G}`,
  row:`<line class="prop" x1="118" y1="10" x2="118" y2="26"/><path class="prop" d="M118,26 L104,58 M118,26 L132,58"/><circle class="stroke" cx="88" cy="60" r="11"/><path class="stroke" d="M99,66 L142,88 L184,110"/><path class="stroke" d="M99,66 L106,58"/><path class="stroke" d="M99,66 L130,58"/><path class="stroke" d="M184,110 L188,120"/>${G}`,
  pullup:`<line class="prop" x1="42" y1="14" x2="180" y2="14"/><circle class="stroke" cx="111" cy="46" r="11"/><path class="stroke" d="M94,17 L104,42"/><path class="stroke" d="M128,17 L118,42"/><path class="stroke" d="M111,57 L111,92"/><path class="stroke" d="M111,92 L98,114 L104,124"/><path class="stroke" d="M111,92 L124,114 L118,124"/>`,
  dbrow:`<rect class="prop" x="18" y="70" width="66" height="9" rx="3"/><line class="prop" x1="30" y1="79" x2="30" y2="120"/><line class="prop" x1="72" y1="79" x2="72" y2="120"/><circle class="stroke" cx="104" cy="50" r="11"/><path class="stroke" d="M115,58 L156,66"/><path class="stroke" d="M115,58 L82,70"/><path class="stroke" d="M126,60 L130,86"/><rect class="prop" x="121" y="86" width="18" height="11" rx="3" stroke="#E6E9F2"/><path class="stroke" d="M156,66 L152,120"/><path class="stroke" d="M156,66 L172,120"/>${G}`,
  plank:`<circle class="stroke" cx="48" cy="86" r="11"/><path class="stroke" d="M59,94 L120,102 L178,112"/><path class="stroke" d="M59,94 L64,110 L38,117"/><path class="stroke" d="M178,112 L186,120"/>${G}`,
  hollow:`<circle class="stroke" cx="98" cy="98" r="11"/><path class="stroke" d="M92,90 L48,76"/><path class="stroke" d="M107,104 L132,112"/><path class="stroke" d="M132,112 L178,82"/>${G}`,
  sideplank:`<circle class="stroke" cx="56" cy="62" r="11"/><path class="stroke" d="M67,70 L122,92 L176,114"/><path class="stroke" d="M67,70 L60,118"/><path class="stroke" d="M67,70 L74,26"/><path class="stroke" d="M176,114 L184,121"/>${G}`,
  legraise:`<circle class="stroke" cx="40" cy="102" r="11"/><path class="stroke" d="M51,110 L112,116"/><path class="stroke" d="M51,110 L28,120"/><path class="stroke" d="M112,116 L128,54"/><path class="prop" d="M146,96 L146,66 M140,74 L146,64 L152,74" stroke="#9B8CE8"/>${G}`,
  bridge:`<circle class="stroke" cx="34" cy="106" r="11"/><path class="stroke" d="M45,112 L96,84"/><path class="stroke" d="M96,84 L114,118"/><path class="stroke" d="M96,84 L156,64"/><path class="stroke" d="M156,64 L166,60"/>${G}`,
  splitsquat:`<rect class="prop" x="158" y="86" width="52" height="34" rx="4"/><circle class="stroke" cx="86" cy="30" r="11"/><path class="stroke" d="M86,41 L90,80"/><path class="stroke" d="M90,80 L72,102 L78,120"/><path class="stroke" d="M90,80 L132,98 L160,87"/>${G}`,
  goblet:`<circle class="stroke" cx="102" cy="28" r="11"/><path class="stroke" d="M102,39 L106,74"/><rect class="prop" x="72" y="48" width="18" height="18" rx="4" stroke="#E6E9F2"/><path class="stroke" d="M102,46 L90,55"/><path class="stroke" d="M106,74 L88,98 L90,120"/><path class="stroke" d="M106,74 L124,98 L122,120"/>${G}`
};

/* ============ exercises ============ */
const EX = [
  {id:'pushup',fig:'pushup',name:'Push-up',group:'push',tier:1,dose:'3 sets × 8–15',
   cue:'Squeeze your glutes so your hips travel in one line with your shoulders, not ahead of them.'},
  {id:'incline',fig:'incline',name:'Incline push-up',group:'push',tier:1,dose:'3 sets × 10–15',
   cue:'Hands on the couch arm or a countertop — the higher your hands, the easier it gets.'},
  {id:'decline',fig:'decline',name:'Decline push-up',group:'push',tier:2,dose:'3 sets × 6–12',
   cue:'Feet up on the couch shifts the load onto your upper chest and shoulders.'},
  {id:'tempo',fig:'tempo',name:'Tempo push-up',group:'push',tier:2,dose:'3 sets × 5–8',
   cue:'Take three full seconds lowering, pause an inch off the floor, then push up normally.'},
  {id:'archer',fig:'archer',name:'Archer push-up',group:'push',tier:2,dose:'3 sets × 4–8 each side',
   cue:'Slide one arm out straight and let the bent arm do almost all the work.'},
  {id:'row',fig:'row',name:'Ring row',group:'pull',tier:1,dose:'3 sets × 8–12',
   cue:'Walk your feet forward to make it harder, back to make it easier, and pull your elbows past your ribs.'},
  {id:'dbrow',fig:'dbrow',name:'Single-arm row',group:'pull',tier:1,dose:'3 sets × 8–12 each side',
   cue:'Brace a hand on the bench and pull the dumbbell to your hip, not your shoulder.'},
  {id:'pullup',fig:'pullup',name:'Pull-up',group:'pull',tier:2,dose:'4 sets × as many as you get',
   cue:'Start with your shoulders pulled down away from your ears, then drive your elbows to the floor.'},
  {id:'plank',fig:'plank',name:'Plank',group:'core',tier:1,dose:'3 × 30–60 seconds',
   cue:'Tuck your ribs down and your hips under so your lower back flattens out.'},
  {id:'sideplank',fig:'sideplank',name:'Side plank',group:'core',tier:1,dose:'3 × 25–45s each side',
   cue:'Stack your feet and push the bottom shoulder away from the floor to stop it sagging.'},
  {id:'hollow',fig:'hollow',name:'Hollow body hold',group:'core',tier:2,dose:'3 × 20–40 seconds',
   cue:'Press your lower back flat into the floor first, then lower your arms and legs only as far as you can hold it there.'},
  {id:'legraise',fig:'legraise',name:'Lying leg raise',group:'core',tier:2,dose:'3 sets × 8–15',
   cue:'Hands under your hips, and stop lowering the moment your back starts to arch.'},
  {id:'bridge',fig:'bridge',name:'Single-leg glute bridge',group:'legs',tier:1,dose:'3 sets × 8–12 each side',
   cue:'Drive through the heel of the planted foot and hold the top for a full second.'},
  {id:'goblet',fig:'goblet',name:'Goblet squat',group:'legs',tier:1,dose:'3 sets × 10–15',
   cue:'Hold the weight at your chest and let it counterbalance you as you sit straight down.'},
  {id:'splitsquat',fig:'splitsquat',name:'Bulgarian split squat',group:'legs',tier:2,dose:'3 sets × 6–10 each side',
   cue:'Rear foot on the couch, front foot far enough forward that your knee stays over your ankle.'}
];

const RECIPES = {
  full:{cards:['push','pull','legs','core','push','core'],tiers:[1,2],label:'Full deck'},
  short:{cards:['push','core','legs'],tiers:[1],label:'Rough day'},
  one:{cards:['push'],tiers:[1],label:'One card'}
};

/* ============ state ============ */
const KEY='deck-state-v1';
let S={streak:0,last:null,history:[],total:0};
let deck=[],idx=0,flipped=false,view='start',doneCount=0;

const today=()=>new Date().toLocaleDateString('en-CA');
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);

async function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw) S=Object.assign(S,JSON.parse(raw));
  }catch(e){/* first run, or storage blocked — start fresh */}
  if(S.last&&daysBetween(S.last,today())>1) S.streak=0;
  paintWeek();
  render();
}
async function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ console.error('Could not save progress',e); }
}

function paintWeek(){
  const w=document.getElementById('week');
  w.innerHTML='';
  const t=today();
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const key=d.toLocaleDateString('en-CA');
    const el=document.createElement('div');
    el.className='day'+(S.history.includes(key)?' on':'')+(key===t?' today':'');
    w.appendChild(el);
  }
}

function build(mode){
  const r=RECIPES[mode];
  const used=new Set();
  deck=r.cards.map(g=>{
    const pool=EX.filter(e=>e.group===g&&r.tiers.includes(e.tier)&&!used.has(e.id));
    const pick=(pool.length?pool:EX.filter(e=>e.group===g))[Math.floor(Math.random()*(pool.length||EX.filter(e=>e.group===g).length))];
    used.add(pick.id);
    return pick;
  });
  idx=0;flipped=false;doneCount=0;view='session';
  render();
}

async function finish(){
  const t=today();
  if(!S.history.includes(t)){
    S.streak=(S.last&&daysBetween(S.last,t)===1)?S.streak+1:1;
    S.last=t;
    S.history.push(t);
    S.history=S.history.slice(-60);
    S.total++;
    await save();
  }
  paintWeek();
  view='done';
  render();
}

function next(counted){
  if(counted) doneCount++;
  if(idx<deck.length-1){ idx++; flipped=false; render(); }
  else finish();
}

function extra(){
  const pool=EX.filter(e=>!deck.some(d=>d.id===e.id));
  deck.push(pool[Math.floor(Math.random()*pool.length)]||EX[0]);
  idx=deck.length-1; flipped=false; view='session'; render();
}

/* ============ render ============ */
const root=document.getElementById('root');

function render(){
  if(view==='start') return renderStart();
  if(view==='session') return renderCard();
  renderDone();
}

function renderStart(){
  const greeting = S.streak>0 ? `${S.streak} day${S.streak>1?'s':''} running.` : 'No deck yet this week.';
  root.innerHTML=`
    <div class="screen">
      <div style="padding-top:52px">
        <div class="eyebrow">${greeting}</div>
        <h1 style="margin-top:12px">How much<br>have you got?</h1>
        <p class="lede">Pick a size before you think about it. A small deck still counts as a day.</p>
      </div>
      <div class="modes">
        <button class="mode" data-mode="full">
          <span class="mode-n">6</span>
          <span><span class="mode-name">Full deck</span>
          <span class="mode-sub">Push, pull, legs, core · about 25 min</span></span>
        </button>
        <button class="mode" data-mode="short">
          <span class="mode-n">3</span>
          <span><span class="mode-name">Rough day</span>
          <span class="mode-sub">Easy variations only · about 10 min</span></span>
        </button>
        <button class="mode" data-mode="one">
          <span class="mode-n">1</span>
          <span><span class="mode-name">One card</span>
          <span class="mode-sub">Do it, then close this · about 3 min</span></span>
        </button>
      </div>
      ${S.total>0?`<button class="reset" id="reset">Clear my history</button>`:''}
    </div>`;
  root.querySelectorAll('.mode').forEach(b=>b.onclick=()=>build(b.dataset.mode));
  const r=root.querySelector('#reset');
  if(r) r.onclick=async()=>{ S={streak:0,last:null,history:[],total:0}; await save(); paintWeek(); render(); };
}

function renderCard(){
  const e=deck[idx];
  const pips=deck.map((_,i)=>`<div class="pip ${i<idx?'done':i===idx?'now':''}"></div>`).join('');
  const last=idx===deck.length-1;
  root.innerHTML=`
    <div class="screen">
      <div class="progress">${pips}</div>
      <div class="card-wrap">
        <div class="card ${flipped?'flipped':''}" id="card" role="button" tabindex="0" aria-label="Flip card for form cue">
          <div class="face front">
            <div class="tag">${e.group} · card ${idx+1} of ${deck.length}</div>
            <figure><svg class="fig" viewBox="0 0 220 132" aria-hidden="true">${F[e.fig]}</svg></figure>
            <div class="ex-name">${e.name}</div>
            <div class="dose">${e.dose}</div>
            <div class="flip-hint">Tap for the one thing that matters</div>
          </div>
          <div class="face back">
            <div class="tag">form cue</div>
            <div class="cue">${e.cue}</div>
            <div class="back-note">Stop a rep or two short of failure. You want to be able to do this again tomorrow.</div>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn ghost" id="skip">Skip</button>
        <button class="btn solid" id="done">${last?'Finish deck':'Done — next'}</button>
      </div>
    </div>`;
  const c=root.querySelector('#card');
  const flip=()=>{flipped=!flipped;c.classList.toggle('flipped',flipped)};
  c.onclick=flip;
  c.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();flip()}};
  root.querySelector('#skip').onclick=()=>next(false);
  root.querySelector('#done').onclick=()=>next(true);
}

function renderDone(){
  const all=doneCount===deck.length;
  root.innerHTML=`
    <div class="screen">
      <div class="done-body">
        <div class="eyebrow">${all?'Deck cleared':`${doneCount} of ${deck.length} done`}</div>
        <div class="streak-num">${S.streak}</div>
        <div class="eyebrow" style="letter-spacing:.16em">day${S.streak===1?'':'s'} in a row</div>
        <p class="done-sub">${all
          ? 'That was the whole deck. Nothing else is required of you tonight.'
          : 'Partial counts. The streak only cares that you opened the deck.'}</p>
      </div>
      <div class="done-actions">
        <button class="btn ghost" style="flex:1" id="more">Add one more card</button>
        <button class="btn solid" id="close">Done for tonight</button>
      </div>
    </div>`;
  root.querySelector('#more').onclick=extra;
  root.querySelector('#close').onclick=()=>{view='start';render()};
}

load();
</script>
</body>
</html>

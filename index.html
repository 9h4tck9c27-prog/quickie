<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quickies</title>
<meta name="description" content="Short bodyweight and dumbbell workouts for when you're too tapped out to leave the house.">
<meta name="theme-color" content="#14141F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quickies">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14141F;
    --slate:#22223A;
    --slate-2:#2C2C48;
    --chalk:#E6E9F2;
    --dim:#797C96;
    --lilac:#9B8CE8;
    --sage:#6FA98B;
    --line:rgba(230,233,242,.12);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--chalk);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
    /* Stops the rubber-band bounce dragging the header up under the
       translucent status bar, which blurs whatever passes beneath it. */
    overscroll-behavior:none;
  }
  body::before{
    content:'';
    position:fixed; inset:0;
    background:radial-gradient(ellipse 90% 60% at 50% -10%, rgba(155,140,232,.16), transparent 70%);
    pointer-events:none;
  }

  .app{
    width:100%; max-width:460px;
    height:100dvh;
    padding-top:max(18px, calc(env(safe-area-inset-top) + 8px));
    padding-right:calc(18px + env(safe-area-inset-right));
    padding-bottom:calc(16px + env(safe-area-inset-bottom));
    padding-left:calc(18px + env(safe-area-inset-left));
    display:flex; flex-direction:column;
    position:relative; z-index:1;
    overflow:hidden;
  }

  /* Installed to the home screen, iOS draws the page under a translucent
     status bar but often reports env(safe-area-inset-top) as 0, so the inset
     alone can't be trusted to clear the clock. The floor covers the tallest
     status bar (Dynamic Island, ~62px); where the inset does report, max()
     still wins. `under-statusbar` is set at runtime by measuring whether the
     page actually fills the screen, so an opaque bar doesn't get padded twice. */
  html.under-statusbar .app{
    padding-top:max(62px, calc(env(safe-area-inset-top) + 8px));
  }

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .wordmark{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800; font-size:15px; letter-spacing:-.02em;
  }
  .wordmark span{color:var(--lilac)}
  .week{display:flex;gap:5px;align-items:center}
  .day{
    width:9px;height:9px;border-radius:2px;
    background:rgba(230,233,242,.11);
    transition:background .3s ease;
  }
  .day.on{background:var(--sage)}
  .day.today{box-shadow:0 0 0 1.5px rgba(155,140,232,.55)}

  /* ---------- shared ---------- */
  .screen{flex:1;min-height:0;display:flex;flex-direction:column;animation:rise .45s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--dim);
  }

  h1{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800; letter-spacing:-.035em; line-height:.98;
    font-size:clamp(30px,8.8vw,40px);
  }

  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  button:focus-visible{outline:2px solid var(--lilac);outline-offset:3px;border-radius:6px}

  /* ---------- start screen ---------- */
  .lede{margin-top:10px;color:var(--dim);font-size:14px;line-height:1.45;max-width:32ch}
  .modes{padding-top:12px;display:flex;flex-direction:column;gap:8px;flex:none}

  /* ---------- mascot ---------- */
  /* The flexible element: everything else takes the height it needs and the
     figure absorbs whatever is left, so the screen never has to scroll. */
  .mascot-wrap{
    flex:1 1 auto; min-height:76px;
    margin-top:8px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  }
  .mascot{
    flex:1 1 auto; min-height:0;
    width:100%;max-width:272px;max-height:162px;
    display:block;overflow:visible;
  }
  .m-stroke{fill:none;stroke:var(--chalk);stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
  .m-rope{fill:none;stroke:var(--lilac);stroke-width:2.4;stroke-linecap:round;opacity:.85}
  .m-ground{stroke:var(--dim);stroke-width:2;opacity:.35;stroke-linecap:round}
  .mascot-cap{
    flex:none;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;
    letter-spacing:.13em;color:var(--dim);
  }

  .footlinks{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;flex:none}
  .linkbtn{
    font-size:11.5px;color:var(--dim);
    text-decoration:underline;text-underline-offset:3px;
  }
  .linkbtn:hover{color:var(--chalk)}

  .mode{
    display:flex;align-items:baseline;gap:13px;
    width:100%; text-align:left;
    padding:13px 16px;
    background:var(--slate);
    border:1px solid var(--line);
    border-radius:13px;
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .mode:hover,.mode:focus-visible{background:var(--slate-2);border-color:rgba(155,140,232,.4);transform:translateY(-2px)}
  .mode:active{transform:translateY(0)}
  .mode-n{
    font-family:'JetBrains Mono',monospace;font-weight:700;
    font-size:17px;color:var(--lilac);min-width:22px;
  }
  .mode-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16.5px;letter-spacing:-.02em}
  .mode-sub{display:block;margin-top:2px;color:var(--dim);font-size:12px;font-weight:400;letter-spacing:0}

  /* ---------- card ---------- */
  .progress{display:flex;gap:4px;margin:14px 0 12px;flex:none}
  .pip{flex:1;height:3px;border-radius:2px;background:rgba(230,233,242,.13)}
  .pip.done{background:var(--sage)}
  .pip.now{background:var(--lilac)}

  .card-wrap{perspective:1400px;flex:1 1 auto;min-height:0;display:flex}
  .card{
    position:relative;width:100%;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.3,.8,.3,1);
    cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--slate);
    border:1px solid var(--line);
    border-radius:20px;
    padding:18px;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .face.back{transform:rotateY(180deg);background:var(--slate-2)}

  .tag{
    font-family:'JetBrains Mono',monospace;font-size:10px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--lilac);
  }
  .tag-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .tag-row .hint{
    font-family:'JetBrains Mono',monospace;font-size:9.5px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  }
  .flipzone{cursor:pointer;display:flex;flex-direction:column;flex:1;min-height:0}
  figure{flex:1;min-height:60px;display:flex;align-items:center;justify-content:center;padding:6px 0}
  svg.fig{width:100%;max-width:260px;max-height:142px;height:auto;display:block}
  .fig .stroke{fill:none;stroke:var(--chalk);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;filter:url(#chalk)}
  .fig .prop{fill:none;stroke:var(--dim);stroke-width:3;stroke-linecap:round;filter:url(#chalk)}
  .fig .ground{stroke:var(--dim);stroke-width:2;stroke-linecap:round;opacity:.55}
  .fig text{fill:var(--lilac);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700}

  .ex-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1.02}
  .dose{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--dim);margin-top:6px}

  .cue{font-size:19px;line-height:1.45;margin-top:16px;letter-spacing:-.01em}
  .back-note{margin-top:auto;font-size:12.5px;color:var(--dim);line-height:1.5}

  /* ---------- logging ---------- */
  .lastline{
    font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;
    color:var(--dim);margin-top:7px;
  }
  .lastline b{color:var(--lilac);font-weight:700}
  .sets-label{
    font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--dim);margin-top:14px;
  }
  .sets{display:flex;gap:7px;margin-top:7px}
  .chip{
    flex:1;display:flex;align-items:center;justify-content:space-between;
    background:rgba(230,233,242,.05);border:1px solid var(--line);
    border-radius:11px;padding:3px;
  }
  .chip button{
    width:30px;height:32px;border-radius:8px;flex:none;
    color:var(--dim);font-size:18px;line-height:1;
  }
  .chip button:hover{color:var(--chalk);background:rgba(230,233,242,.08)}
  .chip b{
    font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;
    min-width:26px;text-align:center;
  }
  .chip.zero b{color:var(--dim);opacity:.5}

  /* ---------- hold timer ---------- */
  .timer{display:flex;align-items:center;gap:13px;margin-top:12px}
  .timer-ring{width:72px;height:72px;flex:none;position:relative;padding:0;border-radius:50%}
  .timer-ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
  .tr-bg{fill:none;stroke:rgba(230,233,242,.1);stroke-width:6}
  .tr-fg{fill:none;stroke:var(--lilac);stroke-width:6;stroke-linecap:round;transition:stroke .4s ease}
  .timer-ring.hit .tr-fg{stroke:var(--sage)}
  .timer-num{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;
  }
  .timer-hint{font-size:12.5px;color:var(--dim);line-height:1.5}

  /* ---------- history ---------- */
  .scroll{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;margin-top:4px}
  .stat-row{display:flex;gap:26px;margin-top:14px}
  .stat b{
    display:block;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
    font-size:30px;letter-spacing:-.03em;line-height:1;
  }
  .stat span{
    display:block;margin-top:5px;font-family:'JetBrains Mono',monospace;
    font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  }
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
  .cal i{display:block;aspect-ratio:1;border-radius:3px;background:rgba(230,233,242,.07)}
  .cal i.on{background:var(--sage)}
  .cal i.future{opacity:.22}
  .exrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .exrow:last-child{border-bottom:none}
  .exname{flex:1;font-size:14px;letter-spacing:-.01em;min-width:0}
  .exlast{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);white-space:nowrap}
  .exbest{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--sage);white-space:nowrap}
  .spark{width:56px;height:20px;flex:none}
  .spark path{fill:none;stroke:var(--lilac);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .empty{color:var(--dim);font-size:14px;line-height:1.55;margin-top:20px;max-width:32ch}

  .actions{display:flex;gap:10px;margin-top:12px;flex:none}
  .btn{
    flex:1;padding:14px;border-radius:13px;
    font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.01em;
    border:1px solid var(--line);
    transition:transform .16s ease,background .16s ease,border-color .16s ease;
  }
  .btn:active{transform:scale(.975)}
  .btn.ghost{color:var(--dim);flex:0 0 34%}
  .btn.ghost:hover{color:var(--chalk);border-color:rgba(230,233,242,.3)}
  .btn.solid{background:var(--lilac);color:#161428;border-color:transparent}
  .btn.solid:hover{background:#ab9dee}

  /* ---------- done ---------- */
  .done-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
  .streak-num{
    font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
    font-size:clamp(70px,26vw,110px);line-height:.85;letter-spacing:-.05em;color:var(--sage);
  }
  .done-sub{color:var(--dim);font-size:15px;line-height:1.5;max-width:30ch}
  .done-actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}

  .reset{
    margin-top:14px;align-self:flex-start;
    font-size:11.5px;color:var(--dim);text-decoration:underline;text-underline-offset:3px;
  }
  .reset:hover{color:var(--chalk)}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
    .card.flipped{transform:none}
    .face.back{transform:none}
    .card.flipped .face.front{display:none}
    .card:not(.flipped) .face.back{display:none}
  }
</style>
<script>
  /* Runs in <head> so the header never paints at the wrong height. */
  (function () {
    var standalone = navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if (!standalone) return;
    document.documentElement.classList.add('standalone');
    /* A translucent status bar means the page fills the whole screen; an
       opaque one means iOS has already reserved that strip and innerHeight
       comes up short. Measuring beats trusting env(), which reports 0 here. */
    try {
      if (window.innerHeight >= screen.height - 12) {
        document.documentElement.classList.add('under-statusbar');
      }
    } catch (e) {
      document.documentElement.classList.add('under-statusbar');
    }
  })();
</script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="chalk">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="app">
  <div class="top">
    <div class="wordmark">quickies<span>.</span></div>
    <div class="week" id="week" aria-label="Last seven days"></div>
  </div>
  <div id="root"></div>
</div>

<script>
/* ============ figures ============ */
const G = '<line class="ground" x1="12" y1="122" x2="208" y2="122"/>';
const F = {
  pushup:`<circle class="stroke" cx="52" cy="58" r="11"/><path class="stroke" d="M63,64 L122,76 L174,92"/><path class="stroke" d="M63,64 L58,119"/><path class="stroke" d="M174,92 L183,119"/>${G}`,
  incline:`<rect class="prop" x="14" y="66" width="52" height="54" rx="4"/><circle class="stroke" cx="80" cy="56" r="11"/><path class="stroke" d="M91,63 L134,86 L180,110"/><path class="stroke" d="M91,63 L62,69"/><path class="stroke" d="M180,110 L188,120"/>${G}`,
  decline:`<rect class="prop" x="168" y="72" width="44" height="48" rx="4"/><circle class="stroke" cx="42" cy="76" r="11"/><path class="stroke" d="M53,80 L112,72 L166,63"/><path class="stroke" d="M53,80 L48,119"/><path class="stroke" d="M166,63 L174,72"/>${G}`,
  tempo:`<circle class="stroke" cx="52" cy="58" r="11"/><path class="stroke" d="M63,64 L122,76 L174,92"/><path class="stroke" d="M63,64 L58,119"/><path class="stroke" d="M174,92 L183,119"/><path class="prop" d="M108,28 L108,52 M102,45 L108,53 L114,45" stroke="#9B8CE8"/><text x="118" y="44">3s</text>${G}`,
  archer:`<circle class="stroke" cx="70" cy="56" r="11"/><path class="stroke" d="M81,62 L134,74 L182,90"/><path class="stroke" d="M81,62 L78,119"/><path class="stroke" d="M81,62 L26,113"/><path class="stroke" d="M182,90 L190,119"/>${G}`,
  row:`<line class="prop" x1="118" y1="10" x2="118" y2="26"/><path class="prop" d="M118,26 L104,58 M118,26 L132,58"/><circle class="stroke" cx="88" cy="60" r="11"/><path class="stroke" d="M99,66 L142,88 L184,110"/><path class="stroke" d="M99,66 L106,58"/><path class="stroke" d="M99,66 L130,58"/><path class="stroke" d="M184,110 L188,120"/>${G}`,
  pullup:`<line class="prop" x1="42" y1="14" x2="180" y2="14"/><circle class="stroke" cx="111" cy="46" r="11"/><path class="stroke" d="M94,17 L104,42"/><path class="stroke" d="M128,17 L118,42"/><path class="stroke" d="M111,57 L111,92"/><path class="stroke" d="M111,92 L98,114 L104,124"/><path class="stroke" d="M111,92 L124,114 L118,124"/>`,
  dbrow:`<rect class="prop" x="18" y="70" width="66" height="9" rx="3"/><line class="prop" x1="30" y1="79" x2="30" y2="120"/><line class="prop" x1="72" y1="79" x2="72" y2="120"/><circle class="stroke" cx="104" cy="50" r="11"/><path class="stroke" d="M115,58 L156,66"/><path class="stroke" d="M115,58 L82,70"/><path class="stroke" d="M126,60 L130,86"/><rect class="prop" x="121" y="86" width="18" height="11" rx="3" stroke="#E6E9F2"/><path class="stroke" d="M156,66 L152,120"/><path class="stroke" d="M156,66 L172,120"/>${G}`,
  plank:`<circle class="stroke" cx="48" cy="86" r="11"/><path class="stroke" d="M59,94 L120,102 L178,112"/><path class="stroke" d="M59,94 L64,110 L38,117"/><path class="stroke" d="M178,112 L186,120"/>${G}`,
  hollow:`<circle class="stroke" cx="98" cy="98" r="11"/><path class="stroke" d="M92,90 L48,76"/><path class="stroke" d="M107,104 L132,112"/><path class="stroke" d="M132,112 L178,82"/>${G}`,
  sideplank:`<circle class="stroke" cx="56" cy="62" r="11"/><path class="stroke" d="M67,70 L122,92 L176,114"/><path class="stroke" d="M67,70 L60,118"/><path class="stroke" d="M67,70 L74,26"/><path class="stroke" d="M176,114 L184,121"/>${G}`,
  legraise:`<circle class="stroke" cx="40" cy="102" r="11"/><path class="stroke" d="M51,110 L112,116"/><path class="stroke" d="M51,110 L28,120"/><path class="stroke" d="M112,116 L128,54"/><path class="prop" d="M146,96 L146,66 M140,74 L146,64 L152,74" stroke="#9B8CE8"/>${G}`,
  bridge:`<circle class="stroke" cx="34" cy="106" r="11"/><path class="stroke" d="M45,112 L96,84"/><path class="stroke" d="M96,84 L114,118"/><path class="stroke" d="M96,84 L156,64"/><path class="stroke" d="M156,64 L166,60"/>${G}`,
  splitsquat:`<rect class="prop" x="158" y="86" width="52" height="34" rx="4"/><circle class="stroke" cx="86" cy="30" r="11"/><path class="stroke" d="M86,41 L90,80"/><path class="stroke" d="M90,80 L72,102 L78,120"/><path class="stroke" d="M90,80 L132,98 L160,87"/>${G}`,
  goblet:`<circle class="stroke" cx="102" cy="28" r="11"/><path class="stroke" d="M102,39 L106,74"/><rect class="prop" x="72" y="48" width="18" height="18" rx="4" stroke="#E6E9F2"/><path class="stroke" d="M102,46 L90,55"/><path class="stroke" d="M106,74 L88,98 L90,120"/><path class="stroke" d="M106,74 L124,98 L122,120"/>${G}`
};

/* ============ exercises ============ */
/* sets/start/target drive the logging chips. `timed` swaps reps for a
   count-up timer, and `target` is where its ring fills up. */
const EX = [
  {id:'pushup',fig:'pushup',name:'Push-up',group:'push',tier:1,dose:'3 sets × 8–15',
   sets:3,start:10,
   cue:'Squeeze your glutes so your hips travel in one line with your shoulders, not ahead of them.'},
  {id:'incline',fig:'incline',name:'Incline push-up',group:'push',tier:1,dose:'3 sets × 10–15',
   sets:3,start:12,
   cue:'Hands on the couch arm or a countertop — the higher your hands, the easier it gets.'},
  {id:'decline',fig:'decline',name:'Decline push-up',group:'push',tier:2,dose:'3 sets × 6–12',
   sets:3,start:8,
   cue:'Feet up on the couch shifts the load onto your upper chest and shoulders.'},
  {id:'tempo',fig:'tempo',name:'Tempo push-up',group:'push',tier:2,dose:'3 sets × 5–8',
   sets:3,start:6,
   cue:'Take three full seconds lowering, pause an inch off the floor, then push up normally.'},
  {id:'archer',fig:'archer',name:'Archer push-up',group:'push',tier:2,dose:'3 sets × 4–8 each side',
   sets:3,start:5,
   cue:'Slide one arm out straight and let the bent arm do almost all the work.'},
  {id:'row',fig:'row',name:'Ring row',group:'pull',tier:1,dose:'3 sets × 8–12',
   sets:3,start:10,
   cue:'Walk your feet forward to make it harder, back to make it easier, and pull your elbows past your ribs.'},

const JOINTS=['hd','sh','hp','el','ha','er','hr','kl','fl','kr','fr'];
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function poseAt(r,phase){
  const ks=r.keys;
  for(let i=0;i<ks.length-1;i++){
    if(phase>=ks[i].t && phase<=ks[i+1].t){
      const span=ks[i+1].t-ks[i].t;
      const k=span<=0?0:(phase-ks[i].t)/span;
      // ease in-out, so it doesn't move like a machine
      const e=k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
      const a=POSE[ks[i].p], b=POSE[ks[i+1].p], out={};
      for(const j of JOINTS) out[j]=[a[j][0]+(b[j][0]-a[j][0])*e, a[j][1]+(b[j][1]-a[j][1])*e];
      return out;
    }
  }
  return POSE[ks[0].p];
}

let lastRoutine=null, stopMascot=null, routine=null;

function pickRoutine(){
  const pool=ROUTINES.filter(r=>r.id!==lastRoutine);
  const r=pool[Math.floor(Math.random()*pool.length)];
  lastRoutine=r.id;
  return r;
}

const MASCOT_SVG=`
  <svg class="mascot" viewBox="0 0 240 150" aria-hidden="true">
    <line class="m-ground" x1="10" y1="132" x2="230" y2="132"/>
    <g id="m-fig">
      <path class="m-rope" id="m-rope"/>
      <circle class="m-stroke" id="m-head" r="13"/>
      <path class="m-stroke" id="m-spine"/>
      <path class="m-stroke" id="m-arml"/>
      <path class="m-stroke" id="m-armr"/>
      <path class="m-stroke" id="m-legl"/>
      <path class="m-stroke" id="m-legr"/>
    </g>
  </svg>`;

/* Animates into an already-rendered MASCOT_SVG. Only attributes are
   touched in the loop — no innerHTML — so it stays cheap on a phone. */
function runMascot(routine){
  const q=id=>document.getElementById(id);
  const head=q('m-head'),spine=q('m-spine'),armL=q('m-arml'),armR=q('m-armr'),
        legL=q('m-legl'),legR=q('m-legr'),rope=q('m-rope'),fig=q('m-fig');
  if(!head) return ()=>{};

  const seg=(...pts)=>'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');

  function draw(p,phase){
    head.setAttribute('cx',p.hd[0].toFixed(1));
    head.setAttribute('cy',p.hd[1].toFixed(1));
    spine.setAttribute('d',seg(p.sh,p.hp));
    armL.setAttribute('d',seg(p.sh,p.el,p.ha));
    armR.setAttribute('d',seg(p.sh,p.er,p.hr));
    legL.setAttribute('d',seg(p.hp,p.kl,p.fl));
    legR.setAttribute('d',seg(p.hp,p.kr,p.fr));
    if(routine.rope){
      // A quadratic only bends halfway to its control point, so the control
      // has to overshoot for the rope to clear the head and the feet.
      const cy=72-Math.cos(phase*Math.PI*2)*150;
      rope.setAttribute('d',`M${p.ha[0]},${p.ha[1]} Q120,${cy.toFixed(1)} ${p.hr[0]},${p.hr[1]}`);
      rope.style.display='';
    } else rope.style.display='none';
  }

  if(REDUCED){ draw(POSE.flexA,0); return ()=>{}; }

  let raf=0, stopped=false;
  function frame(now){
    if(stopped) return;
    const phase=(now%routine.period)/routine.period;
    draw(poseAt(routine,phase),phase);
    if(routine.travel){
      // off one side, back the other way facing the right direction
      const lap=Math.floor(now/routine.travel);
      const tp=(now%routine.travel)/routine.travel;
      const back=lap%2===1;
      const x=back ? 310-tp*380 : -70+tp*380;
      fig.setAttribute('transform', back
        ? `translate(${x.toFixed(1)},0) translate(240,0) scale(-1,1)`
        : `translate(${x.toFixed(1)},0)`);
    }
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  return ()=>{stopped=true;cancelAnimationFrame(raf)};
}

/* ============ state ============ */
const KEY='deck-state-v1';   // key kept; the shape migrates in place
const blank=()=>({v:2,streak:0,last:null,history:[],total:0,log:{},best:{}});
let S=blank();
let deck=[],idx=0,flipped=false,view='start',doneCount=0;
let logVals=[];              // the current card's set values

const today=()=>new Date().toLocaleDateString('en-CA');
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);

async function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw) S=Object.assign(S,JSON.parse(raw));
  }catch(e){/* first run, or storage blocked — start fresh */}
  // v1 saved no log or best; keep the streak and give it the new fields
  if(!S.log) S.log={};
  if(!S.best) S.best={};
  if(!Array.isArray(S.history)) S.history=[];
  S.v=2;
  if(S.last&&daysBetween(S.last,today())>1) S.streak=0;
  paintWeek();
  render();
}
async function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ console.error('Could not save progress',e); }
}

/* ---- logging ---- */
const unit=e=>e.timed?'sec':'reps';
const step=e=>e.timed?5:1;

// Most recent logged session for an exercise, today's included.
function lastEntry(id){
  const rows=S.log[id];
  return rows&&rows.length?rows[rows.length-1]:null;
}

// Prefill: last time's numbers with one more on the first set, which is
// the whole point of logging — the deck should ask for a bit more.
function prefill(e){
  const prev=lastEntry(e.id);
  if(!prev) return Array(e.sets).fill(e.start);
  const out=[];
  for(let i=0;i<e.sets;i++) out.push(prev.v[i]!=null?prev.v[i]:prev.v[prev.v.length-1]);
  const complete=prev.v.length>=e.sets&&prev.v.every(n=>n>0);
  if(complete) out[0]=out[0]+step(e);
  return out;
}

function logSets(e,vals){
  const v=vals.map(n=>Math.max(0,Math.round(n))).filter(n=>n>0);
  if(!v.length) return;
  const d=today();
  const rows=S.log[e.id]||(S.log[e.id]=[]);
  const i=rows.findIndex(r=>r.d===d);
  if(i>=0) rows[i]={d,v}; else rows.push({d,v});
  S.log[e.id]=rows.slice(-40);
  const top=Math.max(...v);
  if(!S.best[e.id]||top>S.best[e.id]) S.best[e.id]=top;
}

function paintWeek(){
  const w=document.getElementById('week');
  w.innerHTML='';
  const t=today();
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const key=d.toLocaleDateString('en-CA');
    const el=document.createElement('div');
    el.className='day'+(S.history.includes(key)?' on':'')+(key===t?' today':'');
    w.appendChild(el);
  }
}

function build(mode){
  const r=RECIPES[mode];
  const used=new Set();
  deck=r.cards.map(g=>{
    const pool=EX.filter(e=>e.group===g&&r.tiers.includes(e.tier)&&!used.has(e.id));
    const pick=(pool.length?pool:EX.filter(e=>e.group===g))[Math.floor(Math.random()*(pool.length||EX.filter(e=>e.group===g).length))];
    used.add(pick.id);
    return pick;
  });
  doneCount=0;view='session';
  setCard(0);
}

function setCard(i){
  clearTimer();
  idx=i; flipped=false;
  logVals=prefill(deck[idx]);
  render();
}

async function finish(){
  const t=today();
  if(!S.history.includes(t)){
    S.streak=(S.last&&daysBetween(S.last,t)===1)?S.streak+1:1;
    S.last=t;
    S.history.push(t);
    S.history=S.history.slice(-60);
    S.total++;
    await save();
  }
  paintWeek();
  view='done';
  render();
}

function next(counted){
  clearTimer();
  if(counted){ logSets(deck[idx],logVals); doneCount++; save(); }
  if(idx<deck.length-1) setCard(idx+1);
  else finish();
}

function extra(){
  const pool=EX.filter(e=>!deck.some(d=>d.id===e.id));
  deck.push(pool[Math.floor(Math.random()*pool.length)]||EX[0]);
  view='session'; setCard(deck.length-1);
}

/* ============ hold timer ============ */
let T={on:false,t0:0,slot:0,iv:null};
const RING=2*Math.PI*31;

function clearTimer(){ if(T.iv) clearInterval(T.iv); T={on:false,t0:0,slot:0,iv:null}; }

function paintTimer(){
  const e=deck[idx];
  const num=document.getElementById('tnum'), fg=document.getElementById('tfg'),
        wrap=document.getElementById('tring'), hint=document.getElementById('thint');
  if(!num) return;
  const secs=T.on?Math.floor((Date.now()-T.t0)/1000):0;
  const target=e.target||60;
  num.textContent=secs;
  fg.setAttribute('stroke-dashoffset',(RING*(1-Math.min(1,secs/target))).toFixed(1));
  wrap.classList.toggle('hit',secs>=target);
  if(hint) hint.textContent=T.on
    ? `Timing set ${T.slot+1}. Tap to stop.`
    : `Tap to time set ${T.slot+1}. Target ${target}s, but stop when form goes.`;
}

function toggleTimer(){
  const e=deck[idx];
  if(!T.on){
    T.on=true; T.t0=Date.now();
    T.iv=setInterval(paintTimer,100);
    paintTimer();
  }else{
    const secs=Math.round((Date.now()-T.t0)/1000);
    clearInterval(T.iv); T.iv=null; T.on=false;
    if(secs>0){ logVals[T.slot]=secs; T.slot=(T.slot+1)%e.sets; }
    render();
  }
}

const root=document.getElementById('root');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function render(){
  if(stopMascot){ stopMascot(); stopMascot=null; }
  if(view==='start') return renderStart();
  if(view==='session') return renderCard();
  if(view==='history') return renderHistory();
  renderDone();
}

/* ---- card ---- */
function lastHTML(e){
  const prev=lastEntry(e.id), best=S.best[e.id];
  if(!prev) return best?`<div class="lastline">best <b>${best}</b> ${unit(e)}</div>`:'';
  const when=prev.d===today()?'today':'last time';
  const complete=prev.v.length>=e.sets&&prev.v.every(n=>n>0);
  const ask=complete?` — asking for <b>${logVals[0]}</b> on the first set`:'';
  return `<div class="lastline">${when} ${prev.v.join(' · ')}${best?` · best <b>${best}</b>`:''}${ask}</div>`;
}

              <div class="tag-row">
                <div class="tag">${e.group} · card ${idx+1} of ${deck.length}</div>
                <div class="hint">tap to flip</div>
              </div>
              <figure><svg class="fig" viewBox="0 0 220 132" aria-hidden="true">${F[e.fig]}</svg></figure>
              <div class="ex-name">${esc(e.name)}</div>
              <div class="dose">${e.dose}</div>
              ${lastHTML(e)}
            </div>
            ${e.timed?timerHTML(e):''}
            ${chipsHTML(e)}
          </div>
          <div class="face back" id="backface" role="button" tabindex="0">
            <div class="tag">form cue</div>
            <div class="cue">${esc(e.cue)}</div>
            <div class="back-note">Stop a rep or two short of failure. You want to be able to do this again tomorrow.</div>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn ghost" id="skip">Skip</button>
        <button class="btn solid" id="done">${last?'Finish deck':'Done — next'}</button>
      </div>
    </div>`;

  const card=root.querySelector('#card');
  const flip=()=>{flipped=!flipped;card.classList.toggle('flipped',flipped)};
  const key=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();flip()}};
  const fz=root.querySelector('#flipzone'), bf=root.querySelector('#backface');
  fz.onclick=flip; fz.onkeydown=key;
  bf.onclick=flip; bf.onkeydown=key;

  // Chips nudge the value in place rather than re-rendering, so a running
  // timer doesn't flicker and the card doesn't jump under your thumb.
  root.querySelector('#sets').onclick=ev=>{
    const b=ev.target.closest('button'); if(!b) return;
    const i=+b.dataset.i;
    logVals[i]=Math.max(0,logVals[i]+(+b.dataset.d)*step(e));
    const chip=b.parentElement;
    chip.querySelector('b').textContent=logVals[i];
    chip.classList.toggle('zero',logVals[i]<=0);
  };

  if(e.timed){
    root.querySelector('#tring').onclick=toggleTimer;
    paintTimer();
  }
  root.querySelector('#skip').onclick=()=>next(false);
  root.querySelector('#done').onclick=()=>next(true);
}

function renderDone(){
  const all=doneCount===deck.length;
  root.innerHTML=`
    <div class="screen">
      <div class="done-body">
        <div class="eyebrow">${all?'Deck cleared':`${doneCount} of ${deck.length} done`}</div>
        <div class="streak-num">${S.streak}</div>
        <div class="eyebrow" style="letter-spacing:.16em">day${S.streak===1?'':'s'} in a row</div>
        <p class="done-sub">${all
          ? 'That was the whole deck. Nothing else is required of you tonight.'
          : 'Partial counts. The streak only cares that you opened the deck.'}</p>
      </div>
      <div class="done-actions">
        <button class="btn ghost" style="flex:1" id="more">Add one more card</button>
        <button class="btn solid" id="close">Done for tonight</button>
      </div>
    </div>`;
  root.querySelector('#more').onclick=extra;
  root.querySelector('#close').onclick=()=>{view='start';render()};
}

/* ---- history ---- */
function calCells(){
  const t=new Date(); t.setHours(0,0,0,0);
  const dow=(t.getDay()+6)%7;                 // Monday-first
  const end=new Date(t); end.setDate(end.getDate()-dow+6);
  const start=new Date(end); start.setDate(start.getDate()-62);
  const out=[];
  for(const d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const k=d.toLocaleDateString('en-CA');
    out.push(`<i class="${S.history.includes(k)?'on':''}${d>t?' future':''}"></i>`);
  }
  return out.join('');
}

function spark(vals){
  if(vals.length<2) return '<span class="spark"></span>';
  const w=56,h=20,p=3;
  const mn=Math.min(...vals), mx=Math.max(...vals), rng=(mx-mn)||1;
  const pts=vals.map((v,i)=>[
    p+i*(w-2*p)/(vals.length-1),
    h-p-((v-mn)/rng)*(h-2*p)
  ]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="M${
    pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' L')}"/></svg>`;
}

function renderHistory(){
  const logged=EX.filter(e=>S.log[e.id]&&S.log[e.id].length)
    .sort((a,b)=>S.log[b.id][S.log[b.id].length-1].d.localeCompare(S.log[a.id][S.log[a.id].length-1].d));

  const rows=logged.map(e=>{
    const entries=S.log[e.id];
    const maxes=entries.slice(-8).map(r=>Math.max(...r.v));
    const prev=entries[entries.length-1];
    return `<div class="exrow">
      <div class="exname">${esc(e.name)}</div>
      <div class="exlast">${prev.v.join(' · ')}</div>
      ${spark(maxes)}
      <div class="exbest">${S.best[e.id]}</div>
    </div>`;
  }).join('');

  root.innerHTML=`
    <div class="screen">
      <div class="footlinks" style="margin-top:0">
        <button class="linkbtn" id="back">&larr; Back</button>
        <span class="eyebrow">history</span>
      </div>
      <div class="scroll">
        <div class="stat-row">
          <div class="stat"><b>${S.total}</b><span>sessions</span></div>
          <div class="stat"><b>${S.streak}</b><span>day streak</span></div>
          <div class="stat"><b>${S.history.length}</b><span>days logged</span></div>
        </div>
        <div class="cal">${calCells()}</div>
        ${logged.length
          ? `<div style="margin-top:22px">
               <div class="sets-label" style="margin-top:0">what moved · best on the right</div>
               <div style="margin-top:4px">${rows}</div>
             </div>`
          : `<p class="empty">Nothing logged yet. Tap the numbers on a card as you go and this fills up on its own — the line shows your best set each session.</p>`}
      </div>
    </div>`;
  root.querySelector('#back').onclick=()=>{view='start';render()};
}

/* Pause the figure while the app is backgrounded. Coming back from a
   glance just resumes it — re-rendering would flash the screen and swap
   the routine under you. Coming back after a while counts as opening the
   app again, so it deals a fresh one. */
const GLANCE=90e3;
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    hiddenAt=Date.now();
    if(stopMascot){stopMascot();stopMascot=null;}
    return;
  }
  if(view!=='start') return;
  if(Date.now()-hiddenAt>GLANCE) render();
  else if(!stopMascot&&routine&&document.getElementById('m-fig')) stopMascot=runMascot(routine);
});

load();
</script>
</body>
</html>

[build]
  publish = "."
  command = ""

# Static single-page app — nothing to build, just serve index.html.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# index.html must never be cached, or the phone keeps serving an old deck
# after a deploy. The fonts it pulls from Google are cached by the browser
# anyway, so there is nothing else here worth a long TTL.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons change rarely and are fetched on every install, so let them sit.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
